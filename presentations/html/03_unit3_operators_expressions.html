<title>יחידה 3 · אופרטורים וביטויים</title>
<style>
/* ============================================================
   DESIGN SYSTEM
   Concept: the deck itself is staged as a code editor / terminal
   window (title-bar dots, file tab) — grounded in the subject
   (learning to code) rather than a generic slide template.
   Committed single dark "editor" world by design (like a themed
   terminal), the same way a themed arcade screen stays single-mode.
   Font stack is an intentional native Hebrew system stack: the
   Artifact sandbox blocks external font fetches, so rather than
   link a webfont that silently falls back, we design directly
   for the Hebrew system faces students' machines already have.
   ============================================================ */
:root{
  --bg:            #0f1420;
  --bg-panel:      #161c2c;
  --bg-panel-2:    #1b2338;
  --bg-titlebar:   #10151f;
  --ink:           #e9edf6;
  --ink-dim:       #939bb8;
  --ink-faint:     #5c6485;
  --line:          #2a3350;
  --line-soft:     #212a44;

  --blue:          #55c6f2;
  --blue-dim:      #2d4a63;
  --gold:          #ffd166;
  --gold-dim:      #5a4a2c;
  --coral:         #ff7a7a;
  --coral-dim:     #5a2f34;
  --green:         #6fe3b4;
  --green-dim:     #204538;
  --violet:        #bda2f2;
  --violet-dim:    #3a2f57;

  --font-display: "Rubik", "Segoe UI Variable Display", "Segoe UI", "Arial Hebrew", "Noto Sans Hebrew", "Heebo", "Arial", sans-serif;
  --font-body:    "Assistant", "Segoe UI", "Arial Hebrew", "Noto Sans Hebrew", "Heebo", "Arial", sans-serif;
  --font-mono:    "JetBrains Mono", "Fira Code", "Cascadia Code", ui-monospace, "SF Mono", Consolas, "Courier New", monospace;

  --radius: 18px;
  --shadow: 0 30px 80px -20px rgba(0,0,0,.65), 0 10px 30px -12px rgba(0,0,0,.5);
}
:root[data-theme="light"], :root[data-theme="dark"]{
  /* Deliberately single-themed (see note above) — both branches keep the editor palette. */
  --bg:#0f1420; --bg-panel:#161c2c; --bg-panel-2:#1b2338; --bg-titlebar:#10151f;
  --ink:#e9edf6; --ink-dim:#939bb8; --ink-faint:#5c6485; --line:#2a3350; --line-soft:#212a44;
}

*{box-sizing:border-box;}
html,body{height:100%;}
body{
  margin:0;
  background:
    radial-gradient(1100px 620px at 12% -8%, #1a2440 0%, transparent 60%),
    radial-gradient(900px 560px at 108% 8%, #1c1f3a 0%, transparent 55%),
    var(--bg);
  color:var(--ink);
  font-family:var(--font-body);
  overflow:hidden;
  -webkit-font-smoothing:antialiased;
}
::selection{ background:var(--blue); color:#0f1420; }

/* ---------- stage & deck window ---------- */
.stage{
  position:fixed; inset:0;
  display:flex; align-items:center; justify-content:center;
  padding:clamp(10px,3vh,34px) clamp(10px,3vw,34px);
}
.deck{
  position:relative;
  width:min(1180px, 96vw);
  height:min(720px, 92vh);
  background:linear-gradient(180deg, var(--bg-panel), var(--bg-panel-2));
  border:1px solid var(--line);
  border-radius:var(--radius);
  box-shadow:var(--shadow);
  display:flex; flex-direction:column;
  overflow:hidden;
}
.titlebar{
  display:flex; align-items:center; gap:14px;
  padding:12px 18px;
  background:var(--bg-titlebar);
  border-bottom:1px solid var(--line);
  direction:ltr; /* window chrome is a UI artifact, always LTR like a real editor */
}
.tb-dots{ display:flex; gap:7px; }
.tb-dots span{ width:11px; height:11px; border-radius:50%; display:block; }
.tb-dots span:nth-child(1){ background:#ff6159; }
.tb-dots span:nth-child(2){ background:#ffbd2e; }
.tb-dots span:nth-child(3){ background:#28c93f; }
.tb-tab{
  font-family:var(--font-mono);
  font-size:12.5px;
  color:var(--ink-dim);
  background:var(--bg-panel);
  border:1px solid var(--line);
  border-bottom:none;
  padding:5px 12px 6px;
  border-radius:8px 8px 0 0;
  margin-inline-start:6px;
}
.tb-tab b{ color:var(--gold); font-weight:600; }
.tb-spacer{ flex:1; }
.tb-progress-label{
  font-family:var(--font-mono); font-size:12px; color:var(--ink-faint);
  font-variant-numeric:tabular-nums;
}

.progress-track{ height:3px; background:var(--line-soft); position:relative; }
.progress-fill{ position:absolute; inset-inline-start:0; top:0; bottom:0; width:0%;
  background:linear-gradient(90deg, var(--blue), var(--green));
  transition:width .35s ease; }

/* ---------- slide viewport ---------- */
.viewport{ position:relative; flex:1; overflow:hidden; }
.slide{
  position:absolute; inset:0;
  display:flex; flex-direction:column;
  padding:clamp(26px,4.4vh,52px) clamp(34px,6vw,76px);
  opacity:0; transform:translateY(14px) scale(.99);
  pointer-events:none;
  transition:opacity .38s ease, transform .38s ease;
  overflow-y:auto;
  direction:rtl;
}
.slide.active{ opacity:1; transform:translateY(0) scale(1); pointer-events:auto; }
@media (prefers-reduced-motion: reduce){
  .slide{ transition:opacity .01s linear; transform:none; }
}

.eyebrow{
  font-family:var(--font-mono); font-size:13px; letter-spacing:.02em;
  color:var(--blue); display:flex; align-items:center; gap:8px; margin-bottom:14px;
  direction:ltr; justify-content:flex-end;
}
.eyebrow .dot{ width:6px; height:6px; border-radius:50%; background:var(--blue); }

h1.slide-title{
  font-family:var(--font-display); font-weight:700;
  font-size:clamp(28px,4.4vh,44px); line-height:1.15; margin:0 0 .4em;
  text-wrap:balance; color:var(--ink);
}
h1.slide-title .accent{ color:var(--gold); }
h2.slide-sub{
  font-family:var(--font-body); font-weight:500; color:var(--ink-dim);
  font-size:clamp(15px,2.2vh,19px); margin:0 0 1.1em; line-height:1.6; max-width:62ch;
}

.body-text{ font-size:clamp(15px,2.1vh,18px); line-height:1.75; color:var(--ink); max-width:70ch; }
.body-text + .body-text{ margin-top:.8em; }

/* ---------- title slide ---------- */
.slide.title-slide{ align-items:center; justify-content:center; text-align:center; }
.title-slide .kicker{
  font-family:var(--font-mono); color:var(--green); font-size:14px;
  border:1px solid var(--green-dim); background:rgba(111,227,180,.08);
  padding:6px 16px; border-radius:999px; margin-bottom:26px; direction:ltr;
}
.title-slide h1{
  font-family:var(--font-display); font-weight:800;
  font-size:clamp(38px,7vh,68px); line-height:1.08; margin:0 0 .3em; text-wrap:balance;
}
.title-slide .py-mark{ color:var(--blue); }
.title-slide .py-mark2{ color:var(--gold); }
.title-slide p{ color:var(--ink-dim); font-size:clamp(16px,2.4vh,21px); max-width:56ch; margin:0 auto; line-height:1.6; }
.prompt-line{
  margin-top:36px; font-family:var(--font-mono); color:var(--ink-faint); font-size:15px; direction:ltr;
}
.prompt-line .caret{ display:inline-block; width:9px; height:1.1em; background:var(--green); margin-inline-start:4px; vertical-align:-2px;
  animation:blink 1.1s steps(1) infinite; }
@keyframes blink{ 50%{ opacity:0; } }
@media (prefers-reduced-motion: reduce){ .prompt-line .caret{ animation:none; } }

/* ---------- icon grid (industries etc.) ---------- */
.grid{ display:grid; gap:16px; margin-top:8px; }
.grid.cols-4{ grid-template-columns:repeat(4,1fr); }
.grid.cols-3{ grid-template-columns:repeat(3,1fr); }
.grid.cols-2{ grid-template-columns:repeat(2,1fr); }
.card{
  background:var(--bg-titlebar); border:1px solid var(--line); border-radius:14px;
  padding:16px 16px 15px; display:flex; flex-direction:column; gap:8px;
}
.card .icon{ width:34px; height:34px; }
.card h3{ margin:2px 0 0; font-family:var(--font-display); font-size:15.5px; font-weight:700; color:var(--ink); }
.card p{ margin:0; font-size:13.5px; line-height:1.55; color:var(--ink-dim); }
.card.blue .icon{ color:var(--blue); } .card.blue{ border-color:var(--blue-dim); }
.card.gold .icon{ color:var(--gold); } .card.gold{ border-color:var(--gold-dim); }
.card.coral .icon{ color:var(--coral); } .card.coral{ border-color:var(--coral-dim); }
.card.green .icon{ color:var(--green); } .card.green{ border-color:var(--green-dim); }
.card.violet .icon{ color:var(--violet); } .card.violet{ border-color:var(--violet-dim); }

/* ---------- badge chips (companies, tags) ---------- */
.chiprow{ display:flex; flex-wrap:wrap; gap:10px; margin-top:14px; direction:rtl; }
.chip{
  font-family:var(--font-mono); font-size:13.5px; color:var(--ink);
  background:var(--bg-titlebar); border:1px solid var(--line);
  padding:7px 14px; border-radius:999px; direction:ltr;
}

/* ---------- two-col layout ---------- */
.split{ display:grid; grid-template-columns:1.1fr .9fr; gap:34px; align-items:center; flex:1; }
.split .art{ display:flex; align-items:center; justify-content:center; }

/* ---------- code block ---------- */
.codewrap{
  background:#0c1019; border:1px solid var(--line); border-radius:12px; overflow:hidden;
  direction:ltr; text-align:left;
}
.codewrap .chead{
  display:flex; align-items:center; gap:8px; padding:8px 12px; background:var(--bg-titlebar);
  border-bottom:1px solid var(--line); font-family:var(--font-mono); font-size:11.5px; color:var(--ink-faint);
}
.codewrap .chead b{ color:var(--green); font-weight:600; }
pre.code{
  margin:0; padding:16px 18px; font-family:var(--font-mono); font-size:14.5px; line-height:1.7;
  overflow-x:auto; direction:ltr; text-align:left; white-space:pre;
}
.tok-kw{ color:var(--violet); font-weight:600; }
.tok-str{ color:var(--gold); }
.tok-num{ color:var(--coral); }
.tok-com{ color:var(--ink-faint); font-style:italic; }
.tok-fn{ color:var(--blue); }
.tok-var{ color:#9fd3ff; }
.tok-punc{ color:var(--ink-dim); }

.outwrap{ background:#0a0d14; border:1px solid var(--line); border-radius:12px; overflow:hidden; direction:ltr; text-align:left; }
.outwrap .ohead{ padding:8px 12px; background:var(--bg-titlebar); border-bottom:1px solid var(--line);
  font-family:var(--font-mono); font-size:11.5px; color:var(--ink-faint); }
.outwrap .obody{ padding:14px 18px; font-family:var(--font-mono); font-size:14.5px; color:var(--green); white-space:pre-wrap; line-height:1.7; }

/* ---------- exercise list ---------- */
.exlist{ list-style:none; margin:10px 0 0; padding:0; display:flex; flex-direction:column; gap:12px; }
.exlist li{
  display:flex; gap:14px; align-items:flex-start;
  background:var(--bg-titlebar); border:1px solid var(--line); border-radius:12px; padding:13px 16px;
}
.exnum{
  flex:none; width:26px; height:26px; border-radius:8px; background:var(--bg-panel-2);
  border:1px solid var(--line); display:flex; align-items:center; justify-content:center;
  font-family:var(--font-mono); font-size:13px; color:var(--ink-dim); font-variant-numeric:tabular-nums;
}
.exbody{ flex:1; font-size:15px; line-height:1.6; }
.exbody code{ font-family:var(--font-mono); background:var(--bg-panel-2); padding:1px 6px; border-radius:5px; color:var(--gold); direction:ltr; unicode-bidi:isolate; display:inline-block; }
.tag{
  flex:none; font-family:var(--font-mono); font-size:11px; padding:3px 9px; border-radius:999px;
  height:fit-content; direction:ltr;
}
.tag.easy{ background:var(--green-dim); color:var(--green); }
.tag.med{ background:var(--gold-dim); color:var(--gold); }
.tag.hard{ background:var(--coral-dim); color:var(--coral); }

/* ---------- callouts ---------- */
.callout{ display:flex; gap:12px; align-items:flex-start; padding:14px 16px; border-radius:12px; margin-top:14px; }
.callout .icon{ width:22px; height:22px; flex:none; margin-top:2px; }
.callout p{ margin:0; font-size:14.5px; line-height:1.6; }
.callout.warn{ background:rgba(255,122,122,.08); border:1px solid var(--coral-dim); }
.callout.warn .icon{ color:var(--coral); }
.callout.tip{ background:rgba(111,227,180,.08); border:1px solid var(--green-dim); }
.callout.tip .icon{ color:var(--green); }

ul.plain, ol.plain{ margin:10px 0 0; padding-inline-start:1.3em; display:flex; flex-direction:column; gap:9px; }
ul.plain li, ol.plain li{ font-size:15.5px; line-height:1.65; }
ul.plain li::marker{ color:var(--blue); }
strong.hl{ color:var(--gold); font-weight:700; }
strong.hl2{ color:var(--blue); font-weight:700; }

/* ---------- roadmap timeline ---------- */
.roadmap{ display:flex; flex-direction:column; gap:10px; margin-top:10px; }
.rgroup{ display:flex; gap:14px; align-items:stretch; }
.rgroup .rlabel{
  flex:none; width:118px; display:flex; align-items:center; justify-content:center; text-align:center;
  font-family:var(--font-display); font-weight:700; font-size:13.5px; border-radius:10px; padding:10px 6px;
}
.rgroup .ritems{ flex:1; display:flex; flex-wrap:wrap; gap:8px; align-content:center; }
.rchip{ background:var(--bg-titlebar); border:1px solid var(--line); border-radius:8px; padding:7px 12px; font-size:13px; color:var(--ink-dim); }
.rgroup.p1 .rlabel{ background:var(--blue-dim); color:var(--blue); }
.rgroup.p2 .rlabel{ background:var(--gold-dim); color:var(--gold); }
.rgroup.p3 .rlabel{ background:var(--violet-dim); color:var(--violet); }
.rgroup.p4 .rlabel{ background:var(--green-dim); color:var(--green); }

/* ---------- controls ---------- */
.controls{
  position:absolute; bottom:16px; inset-inline-end:16px; display:flex; gap:8px; z-index:5;
  direction:ltr;
}
.ctrl-btn{
  width:40px; height:40px; border-radius:10px; border:1px solid var(--line);
  background:var(--bg-titlebar); color:var(--ink-dim); display:flex; align-items:center; justify-content:center;
  cursor:pointer; transition:background .15s, color .15s, border-color .15s;
}
.ctrl-btn:hover{ background:var(--bg-panel-2); color:var(--ink); border-color:var(--blue-dim); }
.ctrl-btn:focus-visible{ outline:2px solid var(--blue); outline-offset:2px; }
.ctrl-btn svg{ width:18px; height:18px; }

.dots-nav{ position:absolute; bottom:20px; inset-inline-start:20px; display:flex; gap:6px; z-index:5; direction:ltr; }
.dots-nav button{
  width:7px; height:7px; border-radius:50%; border:none; background:var(--line); cursor:pointer; padding:0;
}
.dots-nav button.on{ background:var(--blue); width:20px; border-radius:4px; }

.hint{ position:absolute; bottom:18px; left:50%; transform:translateX(-50%); font-family:var(--font-mono);
  font-size:11.5px; color:var(--ink-faint); z-index:4; }

@media (max-width:760px){
  .split{ grid-template-columns:1fr; }
  .grid.cols-4{ grid-template-columns:repeat(2,1fr); }
  .grid.cols-3{ grid-template-columns:repeat(2,1fr); }
}
</style>

/* ============================================================
   RENDER ENGINE — shared across all decks in this course.
   Reads the SLIDES data array above and builds the DOM.
   ============================================================ */
function esc(s){ return String(s); } // content is authored HTML on purpose (icons, spans)

function renderCode(tokens){
  return tokens.map(tk => tk.t ? `<span class="${tk.t}">${tk.c}</span>` : tk.c).join("");
}

function buildSlide(s, i){
  const el = document.createElement("section");
  el.className = "slide";
  el.dataset.index = i;

  if(s.type === "title"){
    el.classList.add("title-slide");
    el.innerHTML = `
      <div class="kicker">${s.kicker}</div>
      <h1>${s.title}</h1>
      <p>${s.sub}</p>
      <div class="prompt-line">${s.prompt}</div>
    `;
  } else if(s.type === "content"){
    el.innerHTML = `
      <div class="eyebrow"><span class="dot"></span>${s.eyebrow}</div>
      <h1 class="slide-title">${s.title}</h1>
      ${s.body}
    `;
  } else if(s.type === "code"){
    el.innerHTML = `
      <div class="eyebrow"><span class="dot"></span>${s.eyebrow}</div>
      <h1 class="slide-title">${s.title}</h1>
      ${s.desc ? `<p class="body-text" style="margin-bottom:16px">${s.desc}</p>` : ""}
      <div class="codewrap">
        <div class="chead"><b>&gt;_</b> example.py</div>
        <pre class="code">${renderCode(s.code)}</pre>
      </div>
      ${s.outText ? `
      <div class="outwrap" style="margin-top:14px">
        <div class="ohead">${s.outLabel || "פלט:"}</div>
        <div class="obody">${s.outText}</div>
      </div>` : ""}
    `;
  } else if(s.type === "exercises"){
    el.innerHTML = `
      <div class="eyebrow"><span class="dot"></span>${s.eyebrow}</div>
      <h1 class="slide-title">${s.title}</h1>
      ${s.desc ? `<p class="body-text" style="margin-bottom:6px">${s.desc}</p>` : ""}
      <ul class="exlist">
        ${s.items.map((it, idx) => `
          <li>
            <span class="tag ${it.tag}">${it.tag === "easy" ? "קל" : it.tag === "med" ? "בינוני" : "מאתגר"}</span>
            <span class="exbody">${it.text}</span>
            <span class="exnum">${idx+1}</span>
          </li>
        `).join("")}
      </ul>
    `;
  }
  return el;
}

(function initDeck(){
  const viewport = document.getElementById("viewport");
  const dotsNav = document.getElementById("dotsNav");
  const fill = document.getElementById("progressFill");
  const pgCur = document.getElementById("pg-cur");
  const pgTotal = document.getElementById("pg-total");
  const tbName = document.getElementById("tb-name");
  if(tbName) tbName.textContent = (typeof FILE_NAME !== "undefined" ? FILE_NAME : "deck.py");

  let cur = 0;
  const n = SLIDES.length;
  pgTotal.textContent = n;

  SLIDES.forEach((s, i) => {
    viewport.appendChild(buildSlide(s, i));
    const dot = document.createElement("button");
    dot.setAttribute("aria-label", "שקופית " + (i+1));
    dot.addEventListener("click", () => go(i));
    dotsNav.appendChild(dot);
  });
  const slideEls = Array.from(viewport.children);
  const dotEls = Array.from(dotsNav.children);

  function go(i){
    cur = Math.max(0, Math.min(n-1, i));
    slideEls.forEach((el, idx) => el.classList.toggle("active", idx === cur));
    dotEls.forEach((el, idx) => el.classList.toggle("on", idx === cur));
    fill.style.width = (n <= 1 ? 100 : (cur/(n-1))*100) + "%";
    pgCur.textContent = cur + 1;
  }
  go(0);

  document.getElementById("btnNext").addEventListener("click", () => go(cur+1));
  document.getElementById("btnPrev").addEventListener("click", () => go(cur-1));
  document.getElementById("btnFs").addEventListener("click", () => {
    if(!document.fullscreenElement){ document.documentElement.requestFullscreen().catch(()=>{}); }
    else { document.exitFullscreen().catch(()=>{}); }
  });

  window.addEventListener("keydown", (e) => {
    if(["ArrowRight","PageDown"," ","Spacebar"].includes(e.key)){ go(cur+1); e.preventDefault(); }
    else if(["ArrowLeft","PageUp"].includes(e.key)){ go(cur-1); e.preventDefault(); }
    else if(e.key === "Home"){ go(0); e.preventDefault(); }
    else if(e.key === "End"){ go(n-1); e.preventDefault(); }
    else if(e.key === "f" || e.key === "F"){ document.getElementById("btnFs").click(); }
  });

  let touchX = null;
  viewport.addEventListener("touchstart", (e) => { touchX = e.touches[0].clientX; }, {passive:true});
  viewport.addEventListener("touchend", (e) => {
    if(touchX === null) return;
    const dx = e.changedTouches[0].clientX - touchX;
    if(Math.abs(dx) > 50){ go(dx < 0 ? cur+1 : cur-1); }
    touchX = null;
  }, {passive:true});
})();
</script>
